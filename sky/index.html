<style>
:root {
  color-scheme: dark;
  --night: #080C1F;
  --panel: rgba(12, 17, 38, 0.94);
  --panel-edge: rgba(217, 178, 106, 0.22);
  --hair: rgba(236, 232, 221, 0.10);
  --text: #ECE8DD;
  --muted: #9AA3BF;
  --faint: #6E7694;
  --brass: #D9B26A;
  --brass-soft: rgba(217, 178, 106, 0.14);
  --steel: #8FA7DC;
  --ok: #86D3A6;
  --low: #E5A95C;
  --radius: 16px;
  --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", "MingLiU", serif;
  --font-body: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--night);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

#app { position: fixed; inset: 0; overflow: hidden; background: var(--night); }
#sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* top bar */
.topbar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 5;
  display: flex; gap: 8px; align-items: center; justify-content: space-between;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px;
  background: linear-gradient(to bottom, rgba(8, 12, 31, 0.92), rgba(8, 12, 31, 0));
  pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.chip {
  display: inline-flex; align-items: center; gap: 7px;
  min-height: 38px; padding: 6px 12px; border-radius: 999px;
  border: 1px solid var(--hair); background: rgba(13, 19, 42, 0.78);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  font-size: 14px; white-space: nowrap; max-width: 60vw; overflow: hidden; text-overflow: ellipsis;
}
.chip svg { flex: none; width: 16px; height: 16px; stroke: var(--brass); }
.chip .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 13.5px; letter-spacing: 0.01em; }
.livedot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(134, 211, 166, 0.18); flex: none; }
.livedot.off { background: var(--low); box-shadow: 0 0 0 3px rgba(229, 169, 92, 0.18); }

.summary {
  position: absolute; z-index: 4; left: 0; right: 0;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 68px);
  display: flex; flex-direction: column; gap: 8px; padding: 0 16px 4px;
}
.sum-day {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 8px 8px 8px 12px; border-radius: 12px; font-size: 13.5px;
  background: rgba(13, 19, 42, 0.86); border: 1px solid var(--panel-edge);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.sum-day .btn { flex: none; }
.sum-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.sum-kicker { font-size: 12px; letter-spacing: 0.16em; color: var(--brass); }
.sum-sun { font-size: 12.5px; color: var(--muted); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.sum-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.sum-chips::-webkit-scrollbar { display: none; }
.sum-chips .btn { flex: none; min-height: 36px; padding: 5px 12px; font-size: 14.5px; background: rgba(13, 19, 42, 0.82); }
.sum-chips .n { font-family: var(--font-display); font-weight: 500; }
.sum-chips .planet .n { color: #E6C47F; }
.sum-chips .d { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

.hint {
  position: absolute; z-index: 4; left: 50%; transform: translateX(-50%);
  top: calc(env(safe-area-inset-top, 0px) + 62px);
  padding: 7px 14px; border-radius: 999px; font-size: 13px; color: var(--muted);
  background: rgba(13, 19, 42, 0.8); border: 1px solid var(--hair); white-space: nowrap;
  transition: opacity .6s;
}

/* zoom */
.zoom {
  position: absolute; z-index: 4; right: 16px;
  top: calc(env(safe-area-inset-top, 0px) + 60px);
  display: flex; flex-direction: column; gap: 8px;
}
.round {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  border: 1px solid var(--hair); background: rgba(13, 19, 42, 0.8);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.round svg { width: 18px; height: 18px; stroke: var(--text); }

/* dock */
.dock {
  position: absolute; z-index: 5; left: 0; right: 0; bottom: 0;
  display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px;
  padding: 8px 16px calc(env(safe-area-inset-bottom, 0px) + 8px);
  background: linear-gradient(to top, rgba(8, 12, 31, 0.96) 55%, rgba(8, 12, 31, 0));
}
.dock button {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 0 4px; border: 0; background: none; border-radius: 12px;
  font-size: 11.5px; letter-spacing: 0.08em; color: var(--muted);
}
.dock svg { width: 22px; height: 22px; stroke: var(--text); opacity: .9; }
.dock button[aria-pressed="true"] { color: var(--brass); }
.dock button[aria-pressed="true"] svg { stroke: var(--brass); }
.dock button:active { background: var(--brass-soft); }

/* sheet */
.sheet {
  position: absolute; z-index: 8; left: 0; right: 0; bottom: 0;
  max-height: min(64%, 620px); display: flex; flex-direction: column;
  background: var(--panel); border-top: 1px solid var(--panel-edge);
  border-radius: 20px 20px 0 0;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  transform: translateY(104%); transition: transform .24s cubic-bezier(.2, .8, .2, 1);
  box-shadow: 0 -18px 40px rgba(0, 0, 0, 0.35);
}
.sheet.open { transform: translateY(0); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px 4px; }
.grip { width: 38px; height: 4px; border-radius: 2px; background: var(--hair); margin: 8px auto 0; }
.sheet-kicker { font-size: 12px; letter-spacing: 0.14em; color: var(--brass); }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--hair); background: none; display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 16px; height: 16px; stroke: var(--muted); }
.sheet-body {
  overflow-y: auto; overscroll-behavior: contain;
  padding: 4px 16px calc(env(safe-area-inset-bottom, 0px) + 20px);
}

.title { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.25; margin: 2px 0 2px; text-wrap: balance; letter-spacing: 0.02em; }
.subtitle { color: var(--muted); font-size: 13.5px; margin: 0 0 10px; }
.subtitle .mono { font-family: var(--font-mono); font-size: 12.5px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
.tag { font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--hair); color: var(--muted); }
.tag.brass { border-color: rgba(217, 178, 106, 0.4); color: var(--brass); }

.status { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 4px 0 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 3px 10px 3px 8px; border-radius: 999px; background: rgba(134, 211, 166, 0.12); color: var(--ok); }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.low { background: rgba(229, 169, 92, 0.12); color: var(--low); }
.pill.off { background: rgba(110, 118, 148, 0.16); color: var(--muted); }
.where { font-size: 14px; color: var(--text); }
.where .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0 0 14px; font-size: 14px; }
.facts dt { color: var(--muted); white-space: nowrap; }
.facts dd { margin: 0; }
.facts .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 13.5px; }
.sec { font-family: var(--font-display); font-weight: 500; font-size: 15px; color: var(--brass); letter-spacing: 0.08em; margin: 16px 0 4px; }
.prose { margin: 0; max-width: 34em; color: var(--text); }
.linkish { background: none; border: 0; padding: 0; color: var(--steel); text-decoration: underline; text-underline-offset: 3px; }

.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; padding: 8px 14px; border-radius: 12px;
  border: 1px solid var(--hair); background: rgba(236, 232, 221, 0.04); font-size: 14px;
}
.btn.primary { border-color: rgba(217, 178, 106, 0.5); background: var(--brass-soft); color: var(--brass); }
.btn.small { min-height: 32px; padding: 4px 11px; font-size: 13px; border-radius: 10px; }

/* list */
.search {
  width: 100%; min-height: 42px; padding: 8px 14px; border-radius: 12px;
  border: 1px solid var(--hair); background: rgba(236, 232, 221, 0.05); outline: none;
}
.search:focus { border-color: rgba(217, 178, 106, 0.55); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; margin: 10px 0 6px; border-radius: 12px; background: rgba(236, 232, 221, 0.05); }
.seg button { border: 0; background: none; min-height: 34px; border-radius: 9px; font-size: 14px; color: var(--muted); }
.seg button[aria-selected="true"] { background: var(--brass-soft); color: var(--brass); }
.group { font-size: 12px; letter-spacing: 0.14em; color: var(--brass); margin: 14px 0 2px; }
.rows { display: flex; flex-direction: column; }
.row {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px;
  width: 100%; text-align: left; padding: 10px 2px; border: 0; background: none;
  border-bottom: 1px solid var(--hair);
}
.row .n { font-family: var(--font-display); font-weight: 500; font-size: 16.5px; }
.row .l { color: var(--muted); font-size: 12.5px; margin-left: 6px; }
.row .r { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.hi { background: var(--ok); }
.dot.lo { background: var(--low); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 2px; }
.chips .btn { min-height: 34px; padding: 4px 12px; font-size: 14px; }
.empty { color: var(--muted); font-size: 14px; padding: 16px 2px; }

/* time */
.clock { font-family: var(--font-mono); font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: 0.01em; margin: 2px 0 8px; }
.range { width: 100%; accent-color: var(--brass); margin: 8px 0 2px; }
.range-scale { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--faint); font-family: var(--font-mono); }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); flex: 1 1 120px; }
.field input {
  min-height: 40px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--hair);
  background: rgba(236, 232, 221, 0.05); color: var(--text); font-family: var(--font-mono); font-size: 14.5px;
}
.fields { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-top: 8px; }
.note { font-size: 13px; color: var(--muted); margin: 6px 0 0; }

/* layers */
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 2px; border-bottom: 1px solid var(--hair); font-size: 15px; }
.switch small { display: block; color: var(--muted); font-size: 12.5px; }
.switch input { appearance: none; -webkit-appearance: none; width: 44px; height: 26px; border-radius: 13px; background: rgba(236, 232, 221, 0.14); position: relative; flex: none; transition: background .15s; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--text); transition: transform .15s; }
.switch input:checked { background: var(--brass); }
.switch input:checked::after { transform: translateX(18px); background: #1A1406; }

.toast {
  position: absolute; z-index: 9; left: 50%; transform: translateX(-50%);
  top: calc(env(safe-area-inset-top, 0px) + 62px);
  padding: 8px 14px; border-radius: 999px; font-size: 13.5px;
  background: rgba(13, 19, 42, 0.95); border: 1px solid var(--panel-edge); white-space: nowrap;
}
#red { position: fixed; inset: 0; z-index: 20; background: #ff1a00; mix-blend-mode: multiply; pointer-events: none; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; z-index: 3; }

@media (min-width: 720px) {
  .sheet { left: auto; right: 16px; bottom: 16px; width: 400px; border-radius: 20px; border: 1px solid var(--panel-edge); max-height: calc(100% - 120px); }
}
@media (prefers-reduced-motion: reduce) {
  .sheet, .hint { transition: none; }
}
</style>
</head>
<body>


<div id="app">
  <canvas id="sky" aria-label="星空圖：拖曳旋轉，雙指縮放，點一下星座或星星查看介紹"></canvas>
  <div id="loading">正在計算星空位置…</div>

  <header class="topbar" id="topbar">

      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="2.2"/><path d="M12 7.5l2.2 5h-4.4z"/><path d="M11 18h2"/></svg>
      指向

      星座
    </button>
    <button type="button" id="btnTime" aria-label="時間">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      時間
    </button>
    <button type="button" id="btnLayers" aria-label="顯示圖層">

  <div class="toast" id="toast" hidden></div>

// ---------------------------------------------------------------- canvas, layout, projection

const domeNow = () => state.view.dome || !!(anim && anim.to.dome);

// ---------------------------------------------------------------- sprites
function makeSprite(size, stops) {

const GLOW = makeSprite(64, [[0, 'rgba(255,255,255,1)'], [0.18, 'rgba(255,255,255,0.45)'], [0.5, 'rgba(255,255,255,0.08)'], [1, 'rgba(255,255,255,0)']]);

// ---------------------------------------------------------------- sky tones

// ---------------------------------------------------------------- rendering
let hitN = 0;
let CUTZ = -0.3;

let placed = [];

function render() {

  }

  for (const b of BODIES) {

  }

// events of a fixed point (RA/Dec, J2000) around state.time
function fixedEvents(raDeg, decDeg) {
  const lat = state.loc.lat, phi = lat * DEG, sp = Math.sin(phi), cp = Math.cos(phi);
  // hour angle and declination of date (precession and nutation included), read off the horizontal vector
  const hv = [0, 0, 0];
  rotInto(eqVec(raDeg, decDeg), hv, 1);
  const d = Math.asin(clamp(cp * hv[0] + sp * hv[2], -1, 1));
  const H = (((Math.atan2(hv[1], cp * hv[2] - sp * hv[0]) * RAD / 15) % 24) + 24) % 24;
  const SID = 1.0027379;
  const at = (hours) => new Date(state.time.getTime() + hours / SID * 3600000);
  const transitAlt = 90 - Math.abs(lat - d * RAD);
  const out = { transit: at((24 - H) % 24), transitAlt };
  // rise and set at the standard altitude of −34′ (atmospheric refraction), as almanacs and SearchRiseSet do
  const cosH0 = (Math.sin(-34 / 60 * DEG) - sp * Math.sin(d)) / (cp * Math.cos(d));
  if (cosH0 <= -1) out.always = true;
  else if (!(cosH0 < 1)) out.never = true;
  else {
    const H0 = Math.acos(cosH0) * RAD / 15;
    out.rise = at((((24 - H0 - H) % 24) + 24) % 24);
    out.set = at((((H0 - H) % 24) + 24) % 24);
    const cz = clamp(Math.sin(d) / Math.cos(phi), -1, 1);
    out.riseAz = Math.acos(cz) * RAD; out.setAz = 360 - out.riseAz;

  return out;
}

    for (const g of order) {
      const list = groups[g].sort((a, b) => raDecOf(a.cEq)[0] - raDecOf(b.cEq)[0]);
      if (list.length) h += '<div class="group">' + g + '星空</div><div class="rows">' + list.map(conRow).join('') + '</div>';
    }
    if (groups.never.length) h += '<div class="group">在你的位置看不到</div><div class="rows">' + groups.never.map(conRow).join('') + '</div>';
  }
  box.innerHTML = h;
}
function openList() {
  state.sel = null;
  openSheet('list', '星座清單', listHTML());
  renderListRows();
  const q = $('#conSearch');
  q.addEventListener('input', renderListRows);
}

// --- time
let timeBase = 0;
function timeHTML() {
  return '<div class="clock" id="clockText">' + longDT(state.time) + '</div>' +
    '<input class="range" id="timeSlider" type="range" min="-720" max="720" step="5" value="0" aria-label="往前或往後調整時間">' +
    '<div class="range-scale"><span>−12 小時</span><span>拖曳調整</span><span>+12 小時</span></div>' +
    '<div class="chips" style="margin-top:12px">' +
    '<button class="btn" data-act="t-now">現在</button>' +
    '<button class="btn" data-act="t-at" data-h="21">晚上 9 點</button>' +
    '<button class="btn" data-act="t-at" data-h="0">午夜 0 點</button>' +
    '<button class="btn" data-act="t-at" data-h="5">清晨 5 點</button>' +
    '<button class="btn" id="playBtn" data-act="t-play" aria-pressed="' + state.playing + '">' + (state.playing ? '停止快轉' : '快轉看星星轉動') + '</button>' +
    '</div>' +
    '<div class="fields"><label class="field" for="dateInput">日期<input id="dateInput" type="date"></label></div>' +
    '<p class="note">時間以手機的時區顯示。星星每天約提早 4 分鐘升起，所以同一時間的星空會隨季節慢慢改變。</p>';
}
function openTime() {
  state.sel = null;
  openSheet('time', '觀測時間', timeHTML());
  timeBase = state.time.getTime();
  const di = $('#dateInput');
  const t = state.time;
  di.value = t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate());
  di.addEventListener('change', () => {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(di.value);
    if (!m) return;
    const d = new Date(state.time);
    d.setFullYear(+m[1], +m[2] - 1, +m[3]);
    setTime(d, true);
  });
  $('#timeSlider').addEventListener('input', (e) => {
    state.live = false;
    state.time = new Date(timeBase + (+e.target.value) * 60000);
    updateEphemeris(); updateTimeUI(); requestRender();
  });
}
function setTime(d, resetSlider) {
  state.live = false;
  state.time = d;
  if (resetSlider) { timeBase = d.getTime(); const s = $('#timeSlider'); if (s) s.value = 0; }
  updateEphemeris(); updateTimeUI(); refreshInfo(); requestRender();
}
function goLive() {
  if (state.playing) togglePlay(false);
  state.live = true; state.time = new Date();
  timeBase = state.time.getTime();
  const s = $('#timeSlider'); if (s) s.value = 0;
  updateEphemeris(); updateTimeUI(); refreshInfo(); requestRender();
}
function togglePlay(on) {
  state.playing = on == null ? !state.playing : on;
  if (state.playing) state.live = false;
  const b = $('#playBtn');
  if (b) { b.setAttribute('aria-pressed', state.playing); b.textContent = state.playing ? '停止快轉' : '快轉看星星轉動'; }
  if (!state.playing) { timeBase = state.time.getTime(); const s = $('#timeSlider'); if (s) s.value = 0; updateTimeUI(); }
  requestRender();
}

// --- place
function placeHTML() {
  const cur = state.loc;
  const chip = (i) => { const c = CITIES[i]; const on = c[0] === cur.name; return '<button class="btn' + (on ? ' primary' : '') + '" data-act="city" data-id="' + i + '">' + c[0] + '</button>'; };
  const range = (a, b) => { let s = ''; for (let i = a; i <= b; i++) s += chip(i); return s; };
  const gpsBlock = STANDALONE
    ? '<div class="actions" style="margin-top:4px"><button class="btn primary" data-act="gps">使用我的位置（GPS）</button></div>' +
      '<p class="note">' + esc(gpsStatus || (state.locMode === 'gps' ? '每次打開 App 會自動更新位置。' : '目前使用你選的地點。')) + '</p>'
    : '<p class="note">這個頁面無法讀取手機定位，請選離你最近的地點，App 會記住你的選擇。台灣各地看到的星空幾乎相同。</p>';
  return '<p class="subtitle" style="margin-top:2px">目前：' + esc(cur.name) + '　<span class="mono">' + Math.abs(cur.lat).toFixed(2) + '°' + (cur.lat >= 0 ? 'N' : 'S') + ' ' + Math.abs(cur.lon).toFixed(2) + '°' + (cur.lon >= 0 ? 'E' : 'W') + '</span></p>' +
    gpsBlock +
    '<div class="group">台灣</div><div class="chips">' + range(0, 20) + '</div>' +
    '<div class="group">觀星景點</div><div class="chips">' + chip(21) + chip(22) + chip(23) + chip(14) + '</div>' +
    '<div class="group">海外</div><div class="chips">' + range(24, CITIES.length - 1) + '</div>' +
    '<div class="group">自訂座標</div>' +
    '<div class="fields"><label class="field" for="latInput">緯度（北為正）<input id="latInput" inputmode="decimal" value="' + cur.lat + '"></label>' +
    '<label class="field" for="lonInput">經度（東為正）<input id="lonInput" inputmode="decimal" value="' + cur.lon + '"></label>' +
    '<button class="btn primary" data-act="coord">套用座標</button></div>' +
    '<p class="note" id="coordErr" hidden></p>';
}
function openPlace() { state.sel = null; openSheet('place', '觀測地點', placeHTML()); }
function setLoc(loc, msg) {
  state.loc = loc; save('loc', loc);
  updateEphemeris(); updateTimeUI(); refreshInfo(); requestRender();
  if (msg !== null) toast(msg === undefined ? '地點已設為' + loc.name : msg);
}
function setManual() { state.locMode = 'manual'; save('locMode', 'manual'); gpsStatus = ''; }

// --- layers
const LAYER_DEFS = [
  ['lines', '星座連線', ''], ['conNames', '星座名稱', ''], ['starNames', '亮星名稱', ''], ['mw', '銀河', '只在天色夠暗時出現'],
  ['dso', '星雲、星團、星系', '放大後會顯示名稱'], ['ecl', '黃道', '太陽、月亮和行星經過的路線（虛線）'], ['grid', '方位高度網格', '每 15° 高度、30° 方位一條線']
];
function layersHTML() {
  return LAYER_DEFS.map(([k, t, s]) => '<label class="switch" for="lay_' + k + '"><span>' + t + (s ? '<small>' + s + '</small>' : '') + '</span><input type="checkbox" id="lay_' + k + '" data-layer="' + k + '"' + (state.layers[k] ? ' checked' : '') + '></label>').join('') +
    '<label class="switch" for="lay_red"><span>夜間紅光模式<small>保護暗適應，觀星時眼睛不會被螢幕光刺激</small></span><input type="checkbox" id="lay_red"' + (state.red ? ' checked' : '') + '></label>' +
    '<p class="note">星表：依巴谷星表 6 等以內亮星（d3-celestial 整理）；天體位置以 Astronomy Engine 即時計算。</p>' +
    (STANDALONE ? '<p class="note"><a href="licenses.html" style="color:var(--brass)">資料來源與授權</a>　·　<a href="privacy.html" style="color:var(--brass)">隱私權政策</a></p>' : '');
}
function openLayers() { state.sel = null; openSheet('layers', '顯示設定', layersHTML()); }
function setRed(on) {
  state.red = on; save('red', on);
  $('#red').hidden = !on;
  $('#btnRed').setAttribute('aria-pressed', on);
  const cb = $('#lay_red'); if (cb) cb.checked = on;
}

// --- delegated clicks inside the sheet and banner
function onAction(e) {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === 'center' && state.sel) {
    if (sensor.on) { state.guide = state.sel; closeSheet(); toast('跟著箭頭移動手機'); }
    else centerOn(selHor(state.sel), selFov(state.sel));
  }
  else if (act === 'gps') requestGPS(true);
  else if (act === 'install') promptInstall();
  else if (act === 'copy-link') copyLink();
  else if (act === 'install-close') { save('installSeen', 1); $('#installCard').hidden = true; layout(); requestRender(); }
  else if (act === 'con') select({ type: 'con', id }, false);
  else if (act === 'body') select({ type: 'body', id }, false);
  else if (act === 'con-go') select({ type: 'con', id }, true);
  else if (act === 'star') select({ type: 'star', id: +id }, false);
  else if (act === 'body-go') select({ type: 'body', id }, true);
  else if (act === 'tab') { listTab = id; sheetBody.querySelectorAll('.seg button').forEach((b) => b.setAttribute('aria-selected', b.dataset.id === id)); renderListRows(); }
  else if (act === 't-now') goLive();
  else if (act === 't-at') setTime(nextClock(+el.dataset.h), true);
  else if (act === 't-play') togglePlay();
  else if (act === 'tonight') { setTime(nextClock(21), true); toast('已切換到晚上 9 點'); }
  else if (act === 'city') {
    const c = CITIES[+id];
    setManual();
    setLoc({ name: c[0], lat: c[1], lon: c[2] });
    sheetBody.innerHTML = placeHTML();
  } else if (act === 'coord') {
    const lat = parseFloat($('#latInput').value), lon = parseFloat($('#lonInput').value);
    const err = $('#coordErr');
    if (!isFinite(lat) || lat < -90 || lat > 90 || !isFinite(lon) || lon < -180 || lon > 180) {
      err.hidden = false; err.textContent = '緯度要在 −90 到 90 之間，經度要在 −180 到 180 之間，例如台北是 25.03、121.56。';
      return;
    }
    err.hidden = true;
    setManual();
    setLoc({ name: '自訂位置', lat, lon });
    sheetBody.innerHTML = placeHTML();
  }
}
sheetBody.addEventListener('click', onAction);
$('#summary').addEventListener('click', onAction);
sheetBody.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.layer) { state.layers[t.dataset.layer] = t.checked; save('layers', state.layers); requestRender(); }
  else if (t.id === 'lay_red') setRed(t.checked);
});
$('#sheetClose').addEventListener('click', closeSheet);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

$('#btnZenith').addEventListener('click', () => { goDome(); });
$('#btnCons').addEventListener('click', () => (sheetKind === 'list' ? closeSheet() : openList()));
$('#btnTime').addEventListener('click', () => (sheetKind === 'time' ? closeSheet() : openTime()));
$('#timeBtn').addEventListener('click', () => (sheetKind === 'time' ? closeSheet() : openTime()));
$('#btnLayers').addEventListener('click', () => (sheetKind === 'layers' ? closeSheet() : openLayers()));
$('#placeBtn').addEventListener('click', () => (sheetKind === 'place' ? closeSheet() : openPlace()));
$('#btnRed').addEventListener('click', () => setRed(!state.red));
$('#btnSensor').addEventListener('click', () => (sensor.on ? stopSensor() : startSensor()));
$('#zoomIn').addEventListener('click', () => zoomBy(1 / 1.7));
$('#zoomOut').addEventListener('click', () => zoomBy(1.7));

// ---------------------------------------------------------------- install to home screen (installable version)
let installEvt = null;
const isStandaloneDisplay = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; updateInstallCard(); });
window.addEventListener('appinstalled', () => { save('installSeen', 1); installEvt = null; updateInstallCard(); toast('已加到主畫面'); });
function updateInstallCard() {
  const card = $('#installCard');
  if (!STANDALONE || isStandaloneDisplay() || load('installSeen', 0)) { if (!card.hidden) { card.hidden = true; layout(); requestRender(); } return; }
  const btn = $('#installBtn'), copy = $('#copyLinkBtn');
  const ua = navigator.userAgent || '';
  const inApp = /\sLine\//.test(ua) ? 'LINE' : (/FBAN|FBAV|Instagram|Messenger/.test(ua) ? 'App' : '');
  copy.hidden = !inApp;
  if (inApp) { $('#installText').textContent = '你正在 ' + inApp + ' 裡開啟。要加到主畫面，請複製網址改用 ' + (isIOS() ? 'Safari' : 'Chrome') + ' 開啟'; btn.hidden = true; }
  else if (installEvt) { $('#installText').textContent = '把頭頂星空安裝到手機桌面'; btn.hidden = false; }
  else if (isIOS()) { $('#installText').textContent = '加到主畫面：點 Safari 的「分享」→「加入主畫面」'; btn.hidden = true; }
  else { $('#installText').textContent = '加到主畫面：點瀏覽器右上角「⋮」→「加到主畫面」或「安裝應用程式」'; btn.hidden = true; }
  if (card.hidden) { card.hidden = false; layout(); requestRender(); }
}
function copyLink() {
  const url = location.origin + location.pathname;
  const fail = () => toast('無法自動複製，請手動複製：' + url.replace(/^https:\/\//, ''));
  try { navigator.clipboard.writeText(url).then(() => toast('已複製網址'), fail); } catch (e) { fail(); }
}
function promptInstall() {
  if (!installEvt) return;
  installEvt.prompt();
  installEvt.userChoice.then((c) => { if (c && c.outcome === 'accepted') save('installSeen', 1); installEvt = null; updateInstallCard(); }).catch(() => {});
}

// ---------------------------------------------------------------- top bar, banner, toast, hint
function updateTimeUI() {
  $('#placeName').textContent = state.loc.name;
  $('#timeText').textContent = shortDT(state.time);
  $('#liveDot').classList.toggle('off', !state.live);
  $('#timeBtn').setAttribute('aria-label', (state.live ? '現在時間 ' : '模擬時間 ') + longDT(state.time) + '，點一下調整');
  const ck = $('#clockText'); if (ck) ck.textContent = longDT(state.time) + (state.live ? '　現在' : '');
  const di = $('#dateInput');
  if (di && document.activeElement !== di) di.value = state.time.getFullYear() + '-' + pad(state.time.getMonth() + 1) + '-' + pad(state.time.getDate());
  if (!state.playing) updateSummary();
}
function updateSummary() {
  const chips = [];
  for (const b of BODIES) {
    if (b.id === 'Sun' || b.hor[2] <= 0) continue;
    if (b.id !== 'Moon' && !(b.mag < 6)) continue;
    const { alt, az } = altAz(b.hor);
    const d = b.id === 'Moon' ? moonPhaseName(moonPhaseDeg) : dirName(az) + ' ' + Math.round(alt) + '°';
    chips.push('<button class="btn planet" type="button" data-act="body" data-id="' + b.id + '"><span class="n">' + PLANET_INFO[b.id].zh + '</span> <span class="d">' + d + '</span></button>');
  }
  CONS.filter((c) => c.cHor[2] > 0.34).sort((a, b) => b.cHor[2] - a.cHor[2]).slice(0, 8)
    .forEach((c) => chips.push('<button class="btn" type="button" data-act="con" data-id="' + c.ab + '"><span class="n">' + esc(c.info.zh) + '</span></button>'));
  $('#sumChips').innerHTML = chips.join('');
  const day = $('#sumDay');
  if (sunAlt > -6) {
    $('#sumDayText').textContent = sunAlt > 0 ? '太陽還在天上，星星被陽光蓋住了。' : '天色還亮，只看得到最亮的星和行星。';
    day.hidden = false;
  } else day.hidden = true;
  let txt = '';
  try {
    const dir = sunAlt > -0.833 ? -1 : +1;
    const t = A.SearchRiseSet('Sun', observer, dir, state.time, 1.1);
    if (t) txt = (dir < 0 ? '日落 ' : '日出 ') + relDay(t.date) + hhmm(t.date);
  } catch (e) { /* ignore */ }
  $('#sumSun').textContent = txt;
  if (!$('#summary').hidden) layout();
}
let toastTimer = 0;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
}
function hideHint() { const h = $('#hint'); if (!h.hidden) { h.style.opacity = 0; setTimeout(() => { h.hidden = true; }, 600); save('hint', 1); } }

// ---------------------------------------------------------------- start
function start() {
  measure();
  updateEphemeris();
  updateTimeUI();
  layout(); cx = cxT; cy = cyT;
  setRed(state.red);
  render();
  $('#loading').hidden = true;
  if (!load('hint', 0)) { $('#hint').hidden = false; setTimeout(hideHint, 7000); }
  window.addEventListener('resize', () => { measure(); requestRender(); });
  setInterval(() => {
    if (state.live && !state.playing) {
      state.time = new Date();
      updateEphemeris(); updateTimeUI(); refreshInfo(); requestRender();
    }
  }, 15000);
  if (document.fonts && document.fonts.load) {
    const sample = CONS.map((c) => c.info.zh).join('') + DIR8.join('');
    Promise.all([document.fonts.load('500 13px "Noto Serif TC"', sample), document.fonts.load('700 15px "Noto Serif TC"', sample)])
      .then(() => requestRender()).catch(() => {});
  }
  if (STANDALONE) {
    $('#btnSensor').hidden = false;
    updateInstallCard();
    if (state.locMode === 'gps') requestGPS(false);
    // the phone may have been asleep for hours: refresh when the app comes back
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') return;
      if (state.live) { state.time = new Date(); updateEphemeris(); updateTimeUI(); refreshInfo(); requestRender(); }
      if (state.locMode === 'gps') requestGPS(false);
    });
  }
}
start();
})();

</script>
<script>if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }</script>
